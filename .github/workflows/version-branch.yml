name: Replicate Commits to Version Branch

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  version-branch:
    if: github.repository == 'openwisp/django-flat-json-widget'
    permissions:
      contents: write # Replicates commits to active version branches.
    uses: openwisp/openwisp-actions/.github/workflows/reusable-version-branch.yml@5072c81386b436b073b67bc7918cec647f9e3414 # 0.1.0
    with:
      module_name: flat_json_widget
