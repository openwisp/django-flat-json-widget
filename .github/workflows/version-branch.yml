name: Replicate Commits to Version Branch

on:
  push:
    branches:
      - master

jobs:
  version-branch:
    if: github.repository == 'openwisp/django-flat-json-widget'
    uses: openwisp/openwisp-utils/.github/workflows/reusable-version-branch.yml@master
    with:
      module_name: flat_json_widget
